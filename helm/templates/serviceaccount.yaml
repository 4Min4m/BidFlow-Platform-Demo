{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.backup.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bidflow-app.labels" . | nindent 4 }}
  annotations:
    # Binds this Kubernetes ServiceAccount to the GCP service account
    # Terraform creates for backups, via GKE Workload Identity — the
    # gsutil call in the CronJob authenticates as that GSA with no key
    # file. The Terraform side of this binding is the
    # google_service_account_iam_member with role
    # "roles/iam.workloadIdentityUser" in terraform/main.tf.
    iam.gke.io/gcp-service-account: {{ .Values.backup.gcpServiceAccountEmail | quote }}
{{- end }}
