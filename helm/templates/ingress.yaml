{{- if .Values.ingress.enabled }}
{{- $publicSvc := "" }}
{{- $publicPort := 0 }}
{{- range $key, $svc := .Values.services }}
{{- if and $svc.enabled $svc.publicEntrypoint }}
{{- $publicSvc = include "bidflow-app.serviceFullname" (dict "root" $ "key" $key) }}
{{- $publicPort = $svc.port }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bidflow-app.fullname" . }}
  labels:
    {{- include "bidflow-app.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: "gce"
    {{- if .Values.ingress.staticIpName }}
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.ingress.staticIpName | quote }}
    {{- end }}
spec:
  rules:
  - http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ $publicSvc }}
            port:
              number: {{ $publicPort }}
{{- end }}
