{{- range $key, $svc := .Values.services }}
{{- if and $svc.enabled $svc.publicEntrypoint }}
{{- $fullname := include "bidflow-app.serviceFullname" (dict "root" $ "key" $key) }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ $fullname }}-backend-config
  labels:
    {{- include "bidflow-app.labels" $ | nindent 4 }}
  namespace: {{ $.Release.Namespace }}
spec:
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health
    port: {{ $svc.port }}
---
{{- end }}
{{- end }}
